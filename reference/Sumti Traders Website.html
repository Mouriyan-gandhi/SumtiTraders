<!DOCTYPE html>
<html lang="en">
<head>

<style>
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  /* view modes */
  .stage.only-desktop .mobile-frame{ display: none; }
  .stage.only-mobile  .desktop-frame{ display: none; }
  .stage.only-mobile { justify-content: center; }
  .stage.only-desktop { justify-content: center; }
</style>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <rect width="200" height="200" fill="#f5ebd1"/>
    <g transform="translate(100,100)" fill="none" stroke="#7a3a2a" stroke-width="1.4">
      <circle r="58"/>
      <circle r="48" stroke-dasharray="2 3"/>
      <g>
        <path d="M0 -34 Q12 -42 0 -54 Q-12 -42 0 -34 Z"/>
        <path d="M0 -34 Q12 -42 0 -54 Q-12 -42 0 -34 Z" transform="rotate(60)"/>
        <path d="M0 -34 Q12 -42 0 -54 Q-12 -42 0 -34 Z" transform="rotate(120)"/>
        <path d="M0 -34 Q12 -42 0 -54 Q-12 -42 0 -34 Z" transform="rotate(180)"/>
        <path d="M0 -34 Q12 -42 0 -54 Q-12 -42 0 -34 Z" transform="rotate(240)"/>
        <path d="M0 -34 Q12 -42 0 -54 Q-12 -42 0 -34 Z" transform="rotate(300)"/>
      </g>
      <text textAnchor="middle" fontFamily="Cormorant Garamond" fontStyle="italic" fontSize="22" fill="#7a3a2a" stroke="none" y="6">ST</text>
    </g>
  </svg>
</template>

</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react" src="patterns.jsx"></script>
<script type="text/babel" data-presets="react" src="home.jsx"></script>
<script type="text/babel" data-presets="react" src="brands.jsx"></script>
<script type="text/babel" data-presets="react" src="about.jsx"></script>
<script type="text/babel" data-presets="react" src="catalogue.jsx"></script>
<script type="text/babel" data-presets="react" src="contact.jsx"></script>
<script type="text/babel" data-presets="react" src="app.jsx"></script>

<script type="text/babel" data-presets="react">
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);

  // View toggle — wire up after mount
  setTimeout(()=>{
    const vt = document.getElementById('vt');
    const stage = document.getElementById('stage');
    if (!vt || !stage) return;
    vt.addEventListener('click', (e)=>{
      const btn = e.target.closest('button');
      if (!btn) return;
      [...vt.querySelectorAll('button')].forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const v = btn.dataset.v;
      stage.classList.remove('only-desktop','only-mobile');
      if (v === 'desktop') stage.classList.add('only-desktop');
      if (v === 'mobile')  stage.classList.add('only-mobile');
    });
  }, 200);
</script>

</body>
</html>
